<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22345c"/>
      <stop offset="1" stop-color="#121c33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#e09a1f"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb6e0"/>
      <stop offset="1" stop-color="#5f7bb0"/>
    </linearGradient>
  </defs>

  <!-- tile with a frame like the in-game panel -->
  <rect x="16" y="16" width="480" height="480" rx="72" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="56" fill="none" stroke="#4a6396" stroke-width="6"/>
  <path d="M 70 70 L 118 70 M 70 70 L 70 118" stroke="#8fa8d8" stroke-width="8" stroke-linecap="round"/>
  <path d="M 442 70 L 394 70 M 442 70 L 442 118" stroke="#8fa8d8" stroke-width="8" stroke-linecap="round"/>
  <path d="M 70 442 L 118 442 M 70 442 L 70 394" stroke="#8fa8d8" stroke-width="8" stroke-linecap="round"/>
  <path d="M 442 442 L 394 442 M 442 442 L 442 394" stroke="#8fa8d8" stroke-width="8" stroke-linecap="round"/>

  <!-- three sliders: the settings -->
  <g stroke-linecap="round">
    <line x1="166" y1="128" x2="166" y2="384" stroke="#0b1222" stroke-width="30"/>
    <line x1="256" y1="128" x2="256" y2="384" stroke="#0b1222" stroke-width="30"/>
    <line x1="346" y1="128" x2="346" y2="384" stroke="#0b1222" stroke-width="30"/>
    <line x1="166" y1="270" x2="166" y2="384" stroke="#f2b233" stroke-width="16"/>
    <line x1="256" y1="196" x2="256" y2="384" stroke="#f2b233" stroke-width="16"/>
    <line x1="346" y1="318" x2="346" y2="384" stroke="#f2b233" stroke-width="16"/>
  </g>
  <g stroke="#0b1222" stroke-width="6">
    <rect x="128" y="246" width="76" height="48" rx="14" fill="url(#steel)"/>
    <rect x="218" y="172" width="76" height="48" rx="14" fill="url(#steel)"/>
    <rect x="308" y="294" width="76" height="48" rx="14" fill="url(#steel)"/>
  </g>
  <g stroke="#2d4478" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="270" x2="182" y2="270"/>
    <line x1="240" y1="196" x2="272" y2="196"/>
    <line x1="330" y1="318" x2="362" y2="318"/>
  </g>
</svg>
