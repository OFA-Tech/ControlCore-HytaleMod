# Gradle runtime options
org.gradle.daemon = true
org.gradle.jvmargs = -Xmx3G
org.gradle.parallel = true
org.gradle.caching = true

# Java / Hytale
java_version = 25
# Hytale server artifact resolved for compilation (stay inside manifestServerVersion).
hytale_version = 0.7.+
# Hytale patchline used for dependency resolution: release or pre-release.
patchline = release
# Server version mirrored for tooling compatibility.
server_version = 0.7.5
# Server version range written into manifest.json.
manifestServerVersion = >=0.7.2 <0.8.0

# Mod identity
# Maven group and root Java package owner.
group = net.ofatech
# Group written into manifest.json. Other mods depend on "<manifest_group>:<mod_id>".
manifest_group = OFATech
# Unique mod identifier (no spaces).
mod_id = ControlCore
# Human-readable mod name, also used for the jar file name.
mod_name = ControlCore
# Fully-qualified plugin entry point class.
main_class = net.ofatech.controlcore.Main
# Comma-separated authors. Names cannot contain spaces. Name, Name|Email or Name|Email|Url.
mod_author = CaioMBA|caiombaraujo@gmail.com|https://github.com/CaioMBA
mod_license = MIT
mod_description = ControlCore, a Hytale mod built to handle server-side configuration.
mod_url = https://github.com/OFA-Tech/ControlCore-HytaleMod
version = 0.19.0

# Manifest / packaging
includes_pack = true
disabled_by_default = false
# Required manifest dependencies. Format: Group:Name=Version,Other:Mod=*
manifest_dependencies = Hytale:AssetModule=*
# Optional manifest dependencies (mods we integrate with when present).
manifest_opt_dependencies = SupremoSama:CustomInventory=*
# CurseForge project ID used by the update checker, if any.
curseforgeID = 1757053

# IDE helpers
injectServerJavadocsIntoSources = true
generateAssetsBinary = false
# Optional path to a local Hytale install / Assets.zip used by dev tasks.
# hytaleHomeOverride = /path/to/Hytale/install/release/package/game/latest/Assets.zip

# Publishing (GitHub Packages): owner/repo
github_repository = OFA-Tech/ControlCore-HytaleMod
