name: Build

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "25"

            - uses: gradle/actions/setup-gradle@v5

            - name: Build, test and check architecture
              run: ./gradlew build -Pstrict
