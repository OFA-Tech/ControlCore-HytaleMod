<style>

    top: 0;
    left: 0;
    width: 100%;

    justify-content: center;

    background: rgba(7, 10, 20, 0.55);
    z-index: 9999;
}

    flex-direction: column;

    border-radius: 24px;

    overflow: hidden;
}

.control-panel-header {
    width: 100%;
    height: 48px;

    display: flex;
    align-items: center;

    background: rgba(15, 23, 42, 0.96);

    width: 80px;
    height: 48px;

    color: #ffffff;

    border: none;
    border-radius: 0 24px 0 0;

    font-size: 14px;
    font-weight: 800;

    cursor: pointer;
}

.control-panel-close-button:hover {
    background: #b91c1c;
}

    flex: 1;

    display: flex;
    flex-direction: column;

    padding: 18px;

    overflow-x: hidden;
    overflow-y: auto;
}

.tabs {
    min-height: 44px;

    display: flex;
    align-items: center;

    margin-bottom: 18px;
    padding: 4px;

    background: rgba(226, 232, 240, 0.75);
    border: 1px solid rgba(148, 163, 184, 0.35);
    border-radius: 16px;

.tab-page {
    flex: 1;

    display: flex;
    flex-direction: column;

    gap: 14px;
}

.tab-heading {
    display: flex;
    flex-direction: column;
    align-items: center;

    margin-bottom: 4px;

    color: #0f172a;

    font-weight: 800;
    text-align: center;

    color: #64748b;

    font-weight: 500;
    text-align: center;

.config-card {
    display: flex;
    flex-direction: column;

    padding: 16px;

    background: #ffffff;
    border: 1px solid rgba(203, 213, 225, 0.9);
    border-radius: 18px;
}

.config-card-title {
    margin-bottom: 14px;

    color: #1e293b;
    font-size: 15px;
    font-weight: 800;
    text-align: left;
}

    display: flex;
    align-items: center;

    margin-bottom: 10px;
}

.form-label {
    width: 170px;
    margin-right: 12px;

    color: #334155;
    font-size: 13px;
    font-weight: 700;
    text-align: right;
}

.form-input {
    flex: 1;
    height: 38px;

    padding: 0 12px;

    color: #0f172a;

    border: 1px solid rgba(148, 163, 184, 0.75);
    border-radius: 12px;

    font-size: 13px;
    font-weight: 500;
}

.form-input:focus {
    border-color: #2563eb;
    background: #ffffff;
    outline: none;

    display: flex;

    padding-left: 182px;
    margin-top: -2px;
    margin-bottom: 6px;
}

.form-help-text {
    color: #64748b;
    font-size: 12px;
    font-style: italic;

    display: flex;
    justify-content: flex-end;
    align-items: center;

    gap: 10px;

.primary-action-button {
    min-width: 110px;
    height: 40px;

    color: #ffffff;
    background: #2563eb;

    border: none;

    font-size: 13px;
    font-weight: 800;

    cursor: pointer;
}

.primary-action-button:hover {
    background: #1d4ed8;
}

.secondary-action-button {
    min-width: 110px;
    height: 40px;

    color: #334155;
    background: #e2e8f0;

    border-radius: 12px;

    font-size: 13px;
    font-weight: 800;

<div class="page-overlay">
    <div class="control-panel" data-hyui-title="ControlCore">
        <div class="control-panel-content">

            <nav class="tabs"
                 data-tabs="server:Server Configs,player:Player Prefs,keymap:Keymaps"
                 data-selected="server"></nav>

            <div class="tab-page" data-hyui-tab-id="server">

                <div class="tab-heading">
                    <p class="tab-title">Main Server Configuration</p>
                    <p class="tab-description">These values map directly to the server config keys.</p>
                </div>

                <div class="config-card">
                    <p class="config-card-title">Identity</p>

                    <div class="form-row">
                        <label for="serverName" class="form-label">Server Name</label>
                        <input id="serverName"
                               type="text"
                               class="form-input"
                               placeholder="Caitos Hytale Server"
                               value="Caitos Hytale Server" />
                    </div>

                    <div class="form-row">
                        <label for="motd" class="form-label">MOTD</label>
                        <input id="motd"
                               type="text"
                               class="form-input"
                               placeholder="WELCOME TO OFA-TECH"
                               value="WELCOME TO OFA-TECH"
                               maxlength="120" />
                    </div>

                    <div class="form-row">
                        <label for="password" class="form-label">Password</label>
                        <input id="password"
                               type="text"
                               class="form-input"
                               placeholder="Leave empty for public server"
                               value=""
                               maxlength="120" />
                    </div>

                    <div class="form-help-row">
                        <p class="form-help-text">Leave the password empty to make the server public.</p>
                    </div>
                </div>

                <div class="config-card">
                    <p class="config-card-title">Capacity</p>

                    <div class="form-row">
                        <label for="maxPlayers" class="form-label">Max Players</label>
                        <input id="maxPlayers"
                               type="number"
                               class="form-input"
                               value="10" />
                    </div>

                    <div class="form-row">
                        <label for="maxViewRadius" class="form-label">Max View Radius</label>
                        <input id="maxViewRadius"
                               type="number"
                               class="form-input"
                               value="5"
                               min="1"
                               max="32"
                               step="1" />
                    </div>
                </div>

                <div class="config-card">
                    <p class="config-card-title">Connection Timeouts</p>

                    <div class="form-row">
                        <label for="playTimeout" class="form-label">Play Timeout</label>
                        <input id="playTimeout"
                               type="text"
                               class="form-input"
                               placeholder="PT10M"
                               value="PT10M" />
                    </div>

                    <div class="form-help-row">
                        <p class="form-help-text">Use ISO-8601 duration format, for example PT10M for ten minutes.</p>
                    </div>
                </div>

                <div class="config-card">
                    <p class="config-card-title">Actions</p>

                    <div class="action-row">
                        <button id="saveServerConfig" class="primary-action-button">Save</button>
                        <button id="reloadServerConfig" class="secondary-action-button">Reset</button>
                    </div>
                </div>

            </div>
            <div class="tab-page" data-hyui-tab-id="server">
                
            </div>
        </div>
