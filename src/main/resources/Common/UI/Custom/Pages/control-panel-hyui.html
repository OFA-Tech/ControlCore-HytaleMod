<style>
    .control-panel {
        anchor-width: 800;
        anchor-height: 600;
    }

    .panel-header {
        layout-mode: left;
        anchor-height: 48;
    }

    .panel-header-spacer {
        anchor-width: 80;
        anchor-height: 48;
    }

    .panel-title {
        flex-weight: 1;
        font-size: 15;
        font-weight: bold;
        text-align: center;
    }

    .panel-close-button {
        anchor-width: 80;
        anchor-height: 48;
        font-weight: bold;
    }

    .tabs {
        anchor-height: 44;
        padding: 4;
    }

    .tab-page {
        layout-mode: topscrolling;
        padding: 18;
    }

    .tab-heading {
        layout-mode: top;
        padding-bottom: 12;
    }

    .tab-title {
        font-size: 22;
        font-weight: bold;
    }

    .tab-description {
        font-size: 13;
        opacity: 0.85;
        padding-top: 4;
    }

    .config-card {
        layout-mode: top;
        padding: 16;
        padding-bottom: 18;
    }

    .config-card-title {
        font-size: 15;
        font-weight: bold;
        padding-bottom: 10;
    }

    .form-row {
        layout-mode: left;
        padding-bottom: 10;
    }

    .form-label {
        anchor-width: 170;
    }

    .form-input {
        flex-weight: 1;
        anchor-height: 38;
    }

    .form-help-row {
        layout-mode: left;
        padding-bottom: 6;
    }

    .form-help-spacer {
        anchor-width: 182;
    }

    .form-help-text {
        font-size: 12;
        font-style: italic;
        opacity: 0.85;
    }

    .action-row {
        layout-mode: left;
        padding-top: 4;
    }

    .primary-action-button {
        anchor-height: 40;
        font-weight: bold;
    }

    .secondary-action-button {
        anchor-height: 40;
        font-weight: bold;
    }

    .section {
        layout-mode: top;
        padding-bottom: 14;
    }

    .section-title {
        font-weight: bold;
        font-size: 18;
        padding-bottom: 6;
    }

    .row {
        layout-mode: left;
        padding-bottom: 8;
    }

    .field-label {
        anchor-width: 240;
    }

    .field {
        flex-weight: 1;
        anchor-height: 32;
    }

    .actions {
        layout-mode: left;
        padding-top: 6;
    }

    .action-btn {
        anchor-height: 34;
    }

    .section-note {
        padding-bottom: 10px;
        opacity: 0.85;
    }

    .subsection-title {
        font-weight: bold;
        font-size: 15;
        padding-top: 4;
        padding-bottom: 6;
    }

    .field-help-italic{
        font-style: italic;
    }

</style>

<div class="page-overlay">
    <div class="container control-panel" data-hyui-title="ControlCore">
        <div class="container-contents">
            <nav class="tabs"
                 data-tabs="server:Server Configs,player:Player Prefs,keymap:Keymaps"
                 data-selected="server"></nav>

            <div class="tab-content" data-hyui-tab-id="server">
                <div class="tab-page">
                    <div class="tab-heading">
                        <label class="tab-title default-style">Main Server Configuration</label>
                        <label class="tab-description default-style">These values map directly to the server config keys.</label>
                    </div>

                    <div class="config-card">
                        <label class="config-card-title default-style">Identity</label>

                        <div class="form-row">
                            <label for="serverName" class="form-label default-style">Server Name</label>
                            <input id="serverName" type="text" class="form-input default-style" placeholder="Caitos Hytale Server" value="Caitos Hytale Server" />
                        </div>

                        <div class="form-row">
                            <label for="motd" class="form-label default-style">MOTD</label>
                            <input id="motd" type="text" class="form-input default-style" placeholder="WELCOME TO OFA-TECH" value="WELCOME TO OFA-TECH" maxlength="120" />
                        </div>

                        <div class="form-row">
                            <label for="password" class="form-label default-style">Password</label>
                            <input id="password" type="text" class="form-input default-style" placeholder="Leave empty for public server" value="" maxlength="120" />
                        </div>
                        <div class="form-help-row">
                            <div class="form-help-spacer"></div>
                            <label class="form-help-text default-style">Leave the password empty to make the server public.</label>
                        </div>
                    </div>

                    <div class="config-card">
                        <label class="config-card-title default-style">Capacity</label>

                        <div class="form-row">
                            <label for="maxPlayers" class="form-label default-style">Max Players</label>
                            <input id="maxPlayers" type="number" class="form-input default-style" value="10" />
                        </div>

                        <div class="form-row">
                            <label for="maxViewRadius" class="form-label default-style">Max View Radius</label>
                            <input id="maxViewRadius" type="range" class="form-input default-style" value="5" min="1" max="32" step="1" />
                        </div>
                    </div>

                    <div class="config-card">
                        <label class="config-card-title default-style">Connection Timeouts</label>

                        <div class="form-row">
                            <label for="playTimeout" class="form-label default-style">Play Timeout</label>
                            <input id="playTimeout" type="text" class="form-input default-style" placeholder="PT10M" value="PT10M" />
                        </div>
                        <div class="form-help-row">
                            <div class="form-help-spacer"></div>
                            <label class="form-help-text default-style">Use ISO-8601 duration format, for example PT10M for ten minutes.</label>
                        </div>
                    </div>

                    <div class="config-card">
                        <label class="config-card-title default-style">Actions</label>

                        <div class="action-row">
                            <button id="saveServerConfig" class="primary-action-button">Save</button>
                            <button id="reloadServerConfig" class="secondary-action-button secondary-button">Reset</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-content" data-hyui-tab-id="player">
                <div class="tab-page">
                    <div class="section">
                        <p class="section-title">Player Preferences</p>

                        <div class="row">
                            <labeled-checkbox id="prefDarkMode">Dark mode</labeled-checkbox>
                        </div>

                        <div class="row">
                            <labeled-checkbox id="prefCompactLayout">Compact layout</labeled-checkbox>
                        </div>

                        <div class="row">
                            <labeled-checkbox id="prefShowHints">Show UI hints</labeled-checkbox>
                        </div>

                        <div class="row">
                            <label for="prefUiScale" class="field-label default-style">UI Scale</label>
                            <input id="prefUiScale" type="range" class="field default-style" min="80" max="140" step="5" value="100" />
                        </div>

                        <div class="actions">
                            <button id="savePlayerPrefs" class="action-btn">Save</button>
                            <button id="resetPlayerPrefs" class="action-btn secondary-button">Reset</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-content" data-hyui-tab-id="keymap">
                <div class="tab-page">
                    <div class="section">
                        <p class="section-title">Keymaps</p>
                        <p class="default-style">Map commands to keys. “Server Default” is the recommended binding.</p>

                        <div class="section">
                            <p class="section-title">Commands</p>

                            <div class="row">
                                <label class="field-label default-style">Open Control Panel</label>
                                <label id="bindOpenPanel" class="field default-style">Unbound</label>
                                <button id="rebindOpenPanel" class="secondary-button">Rebind</button>
                                <button id="resetOpenPanel" class="tertiary-button">Server Default</button>
                            </div>

                            <div class="row">
                                <label class="field-label default-style">Reload Server Config</label>
                                <label id="bindReloadServer" class="field default-style">Unbound</label>
                                <button id="rebindReloadServer" class="secondary-button">Rebind</button>
                                <button id="resetReloadServer" class="tertiary-button">Server Default</button>
                            </div>

                            <div class="row">
                                <label class="field-label default-style">Toggle Debug</label>
                                <label id="bindToggleDebug" class="field default-style">Unbound</label>
                                <button id="rebindToggleDebug" class="secondary-button">Rebind</button>
                                <button id="resetToggleDebug" class="tertiary-button">Server Default</button>
                            </div>
                        </div>

                        <div class="actions">
                            <button id="saveKeymaps" class="action-btn">Save</button>
                            <button id="resetAllKeymaps" class="action-btn secondary-button">Reset All</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
